# nexa-server behind nginx on the host. The container listens on 127.0.0.1:8080 (NEXA_LOCAL_PORT), and
# COMPOSE_PROFILES must not contain "caddy", since Caddy would want ports 80 and 443 as well.
#
# Copy to /etc/nginx/conf.d/nexa-server.conf, replace nexa.example.com, get the certificate first
# (e.g. `certbot certonly --nginx -d nexa.example.com`), then `nginx -t && systemctl reload nginx`.

# WebSocket upgrades need these two headers passed on explicitly; this is the recipe from nginx's docs.
# If another site on this nginx already defines $connection_upgrade, drop this block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nexa.example.com;

    ssl_certificate     /etc/letsencrypt/live/nexa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexa.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The server pings every 30 s; a shorter timeout would cut idle WebSockets.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

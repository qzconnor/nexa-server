# nexa-server behind Caddy, which gets the certificate from Let's Encrypt. HTTPS is not optional:
# invite codes travel in the join request, and the PWA's service worker and Web Push need it later.
# Needs NEXA_DOMAIN (see .env.example); ports 80 and 443 must reach this machine.
services:
  server:
    build: .
    image: nexa-server:latest
    restart: unless-stopped
    # tini as PID 1 forwards signals, so `docker compose stop` shuts the relay down cleanly.
    init: true
    environment:
      TZ: ${TZ:-Europe/Berlin}
      NEXA_MAX_INSTANCES: ${NEXA_MAX_INSTANCES:-20}
      NEXA_MAX_MESSAGE_KB: ${NEXA_MAX_MESSAGE_KB:-1024}
      NEXA_LOG_LEVEL: ${NEXA_LOG_LEVEL:-info}
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NEXA_DOMAIN: ${NEXA_DOMAIN:?NEXA_DOMAIN fehlt, siehe .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  data:
  caddy-data:
  caddy-config:
